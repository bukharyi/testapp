plugins {
    id "com.android.application"
}

android {
    namespace "io.github.bukharyi.stresslive"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.bukharyi.stresslive"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Garmin Connect IQ Mobile SDK: talks to the watch through the Garmin Connect app.
    implementation "com.garmin.connectiq:ciq-companion-app-sdk:2.0.3@aar"
    testImplementation "junit:junit:4.13.2"
}
